# ---------------------------------------------------------------------------
# Exchange manager cho fault-tolerant execution: dữ liệu trung gian giữa các
# stage được spool lên s3://exchange (MinIO) để task hỏng chạy lại được mà
# không phải tính lại stage trước. Chỉ được dùng khi retry-policy khác NONE
# (TRINO_RETRY_POLICY trong .env). Coordinator và worker dùng cùng cấu hình.
# ---------------------------------------------------------------------------
exchange-manager.name=filesystem
exchange.base-directories=s3://exchange
exchange.s3.region=${ENV:MINIO_REGION}
exchange.s3.endpoint=${ENV:MINIO_ENDPOINT}
exchange.s3.path-style-access=true
exchange.s3.aws-access-key=${ENV:MINIO_ROOT_USER}
exchange.s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
