# ---------------------------------------------------------------------------
# System access control dựa trên file. Trino 4xx yêu cầu khai ở file riêng
# này thay vì config.properties. Luật chi tiết: trino/security/rules.json.
# ---------------------------------------------------------------------------
access-control.name=file
security.config-file=/etc/trino/security/rules.json

# Nạp lại luật định kỳ, không cần khởi động lại coordinator
security.refresh-period=30s
