# ---------------------------------------------------------------------------
# trino-coordinator: lập kế hoạch, lập lịch, resource group, phân quyền.
# Không nhận task xử lý dữ liệu (node-scheduler.include-coordinator=false).
# ---------------------------------------------------------------------------
coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

# --- Bộ nhớ ---------------------------------------------------------------
# Ràng buộc Trino kiểm tra lúc khởi động (vi phạm thì node không khởi động):
#     query.max-memory-per-node + memory.heap-headroom-per-node <= heap khả dụng
#
# Coordinator chạy với -Xmx2500m (heap khả dụng ~2,45 GB). Vì không chạy task,
# max-memory-per-node ở đây chỉ cần thoả ràng buộc trên.
# query.max-memory là trần bộ nhớ của một query trên toàn cụm.
query.max-memory=6GB
query.max-memory-per-node=1GB
memory.heap-headroom-per-node=0.7GB

# --- Song song ------------------------------------------------------------
# Khai tường minh dù trùng giá trị Trino tự tính: `cpus:` trong compose đặt
# cgroup quota, JVM đọc được quota đó và Trino suy ra 2 thread. Khai rõ giúp
# cấu hình không phụ thuộc môi trường chạy (ví dụ Kubernetes không đặt
# limits.cpu thì JVM thấy toàn bộ core của node).
task.concurrency=2
task.max-worker-threads=2
task.min-writer-count=1
query.max-history=50
query.client.timeout=10m

# --- Fault-tolerant execution (FTE) ---------------------------------------
# NONE | TASK | QUERY, đặt qua biến TRINO_RETRY_POLICY trong .env.
#
# TASK: khi một task hỏng (ví dụ worker chết), chỉ task đó được chạy lại
# thay vì cả query. Đổi lại, mỗi stage ghi kết quả trung gian ra exchange
# manager (bucket s3://exchange trên MinIO) thay vì truyền thẳng qua bộ nhớ.
retry-policy=${ENV:TRINO_RETRY_POLICY}

# Bộ nhớ ước lượng ban đầu cho mỗi task. Mặc định 5GB lớn hơn
# query.max-memory-per-node của worker (2GB), khiến scheduler không xếp được
# task nào; 1GB vừa với worker và được tự tăng khi task hết bộ nhớ rồi retry.
fault-tolerant-execution-task-memory=1GB

# Số partition của exchange cho mỗi stage. Mặc định 50 là quá nhiều với hai
# worker, chỉ sinh nhiều file nhỏ trên s3://exchange.
fault-tolerant-execution-max-partition-count=8
fault-tolerant-execution-min-partition-count=2

# Gom split lớn hơn để giảm số lần đọc/ghi MinIO.
fault-tolerant-execution-standard-split-size=32MB

# Coordinator giữ mô tả task trong heap để chạy lại khi cần; đặt trần để
# không chiếm phần lớn heap 2,45 GB.
fault-tolerant-execution-task-descriptor-storage-max-memory=100MB

# Nén dữ liệu trao đổi giữa các stage. Với FTE dữ liệu này đi qua cả mạng và
# MinIO, nên nén giảm đáng kể I/O.
exchange.compression-codec=LZ4

# --- Cost-based optimizer (CBO) -------------------------------------------
# Khai tường minh (trùng mặc định) để dễ thấy và dễ tắt khi so sánh. CBO chỉ
# có tác dụng khi có thống kê; thiếu thống kê, Trino quay về heuristic và giữ
# thứ tự JOIN như trong câu SQL.
#
# Nguồn thống kê trong pipeline:
#   bảng Trino ghi  - iceberg.extended-statistics.collect-on-write=true
#   bảng Spark ghi  - CALL system.compute_table_stats (spark/jobs/ingest_bronze.py)
#   bảo trì         - ANALYZE trong DAG Airflow và sql/maintenance/
optimizer.join-reordering-strategy=AUTOMATIC
join-distribution-type=AUTOMATIC
optimizer.max-reordered-joins=8

# EXPLAIN của mọi query (không chỉ EXPLAIN ANALYZE) kèm ước lượng số dòng và
# chi phí, để quan sát được quyết định của CBO.
collect-plan-statistics-for-all-queries=true

# --- Dynamic filtering ----------------------------------------------------
# Phía build của JOIN chạy trước, thu tập giá trị khoá rồi đẩy sang phía
# probe; connector Iceberg dùng tập này để bỏ qua file/partition không thể
# khớp.
#
# Ngưỡng bên dưới quyết định khi nào Trino bỏ filter: khi phía build có quá
# nhiều giá trị phân biệt, filter không còn lọc được gì mà vẫn tốn chi phí.
# Trino 483 chỉ còn các tên property phẳng dưới đây; các tên cũ
# dynamic-filtering.small.* / .large.* đã bị loại bỏ và làm node không khởi
# động được. Ngưỡng có hiệu lực thực sự ở worker (xem worker/config.properties).
enable-dynamic-filtering=true
dynamic-filtering.max-distinct-values-per-driver=10000
dynamic-filtering.max-size-per-driver=1MB

# --- Spill to disk --------------------------------------------------------
# Bật ở cả coordinator: giá trị mặc định của session property spill_enabled
# (thứ worker thực sự đọc) lấy từ cấu hình coordinator. Đường ghi nằm trong
# volume trino-coordinator-data; coordinator không chạy task nên thực tế
# không spill, nhưng cấu hình giữ nhất quán với worker.
spill-enabled=true
spiller-spill-path=/data/trino/spill
spiller-threads=2
spiller-max-used-space-threshold=0.9
max-spill-per-node=8GB
query-max-spill-per-node=4GB
spill-compression-codec=LZ4

# --- Bảo mật ---------------------------------------------------------------
# Access control khai ở file riêng etc/access-control.properties (yêu cầu
# của Trino 4xx), xem trino/coordinator/access-control.properties.

# Môi trường local không bật authentication (HTTP), nên Web UI dùng user cố định.
web-ui.authentication.type=fixed
web-ui.user=admin
