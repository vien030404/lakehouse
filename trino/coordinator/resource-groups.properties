# ---------------------------------------------------------------------------
# Resource groups: hàng đợi và hạn mức tài nguyên theo nhóm query.
#
# Chỉ coordinator đọc file này; worker nhận task đã được coordinator xếp lịch.
#
# Khác với query.max-memory (trần cho một query), resource group đặt trần
# cho tổng các query trong một nhóm và số query được chạy đồng thời. Vượt
# hạn mức thì query được xếp hàng, không bị từ chối.
#
# Cây nhóm và quy tắc chọn nhóm: resource-groups.json
# Giải thích chi tiết: trino/coordinator/RESOURCE-GROUPS.md
# ---------------------------------------------------------------------------
resource-groups.configuration-manager=file
resource-groups.config-file=/etc/trino/resource-groups.json
