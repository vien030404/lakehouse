# ---------------------------------------------------------------------------
# Catalog `lakehouse`: Iceberg qua REST catalog (dùng chung với Spark) + MinIO
# ---------------------------------------------------------------------------
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lakehouse

# Định dạng file và codec nén cho dữ liệu Trino ghi
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Thu thống kê mở rộng (NDV) ngay khi ghi, để CBO có số liệu cho bảng dbt dựng
iceberg.extended-statistics.collect-on-write=true
iceberg.register-table-procedure.enabled=true

# Ngưỡng giữ lại tối thiểu cho expire_snapshots / remove_orphan_files.
# Mặc định 7 ngày; hạ xuống 1h để bảo trì được các bảng stream commit liên
# tục (DAG Airflow vẫn truyền retention 1-7 ngày cho từng bảng).
iceberg.expire-snapshots.min-retention=1h
iceberg.remove-orphan-files.min-retention=1h

# Dynamic filtering: chờ tối đa 5s để nhận filter từ phía build trước khi quét
iceberg.dynamic-filtering.wait-timeout=5s

# --- Object storage: MinIO (API S3) --------------------------------------
# Native S3 filesystem của Trino 4xx (fs.s3.enabled)
fs.s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.region=${ENV:MINIO_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
