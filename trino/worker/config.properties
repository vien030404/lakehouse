# ---------------------------------------------------------------------------
# trino-worker-1 / trino-worker-2 (dùng chung file này): đọc/ghi Parquet,
# thực thi join, aggregation, ghi bảng.
# ---------------------------------------------------------------------------
coordinator=false
http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

# --- Bộ nhớ ---------------------------------------------------------------
# -Xmx3g -> heap khả dụng ~3,15 GB. max-memory-per-node + headroom
# = 2,0 + 0,8 = 2,8 GB, còn biên an toàn (ràng buộc giải thích ở
# coordinator/config.properties). Tăng bộ nhớ mỗi query thì phải tăng -Xmx
# và mem_limit của container tương ứng.
query.max-memory=6GB
query.max-memory-per-node=2GB
memory.heap-headroom-per-node=0.8GB

# --- Song song ------------------------------------------------------------
# Khai tường minh (trùng giá trị Trino tự tính từ cgroup quota `cpus: 1.0`)
# để cấu hình không phụ thuộc môi trường chạy.
task.concurrency=2
task.max-worker-threads=2
task.min-writer-count=1

# --- Fault-tolerant execution ---------------------------------------------
# Worker phải dùng cùng retry-policy với coordinator; lệch nhau thì task bị
# từ chối.
retry-policy=${ENV:TRINO_RETRY_POLICY}
exchange.compression-codec=LZ4

# --- Dynamic filtering ----------------------------------------------------
# Ngưỡng phải khai ở worker: DynamicFilterSourceOperator - thành phần thu tập
# giá trị từ phía build - chạy trên worker và đọc cấu hình của chính node đó.
# Khai ở coordinator (nơi không chạy task) không có tác dụng.
#
# enable-dynamic-filtering là session property nên được truyền từ coordinator
# xuống, không cần lặp lại ở đây.
dynamic-filtering.max-distinct-values-per-driver=10000
dynamic-filtering.max-size-per-driver=1MB

# --- Spill to disk --------------------------------------------------------
# Khi một operator (hash table của JOIN, buffer ORDER BY, aggregation) vượt
# phần bộ nhớ được cấp, Trino ghi tạm xuống đĩa thay vì báo
# EXCEEDED_LOCAL_MEMORY_LIMIT: chậm hơn nhưng query hoàn thành.
#
# Đường ghi nằm trong volume trino-worker-N-data (node.data-dir=/data/trino),
# không nằm trong layer của container vì spill có thể tới vài GB.
spill-enabled=true
spiller-spill-path=/data/trino/spill
spiller-threads=2

# Ngừng spill khi đĩa đã dùng 90%, tránh làm đầy volume.
spiller-max-used-space-threshold=0.9

# Trần spill cho cả node và cho một query, đặt dưới dung lượng volume.
max-spill-per-node=8GB
query-max-spill-per-node=4GB
spill-compression-codec=LZ4

# Khi bộ nhớ dùng chạm 90%, Trino yêu cầu các operator lớn nhất nhả bộ nhớ
# (revoke) xuống còn 50% - đây là cơ chế kích hoạt spill.
memory-revoking-threshold=0.9
memory-revoking-target=0.5
