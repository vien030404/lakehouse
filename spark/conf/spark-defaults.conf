# ===========================================================================
# spark-defaults.conf - cấu hình mặc định cho mọi ứng dụng Spark (driver)
#
# Master và worker chỉ cấp tài nguyên, không dùng file này để chạy job.
# Driver (spark-submit, spark-streaming) đọc file này và gửi phần cấu hình
# cần thiết xuống executor.
# ===========================================================================

# --- Cụm -------------------------------------------------------------------
spark.master                         spark://spark-master:7077
# Standalone không hỗ trợ cluster mode cho ứng dụng Python, nên driver luôn
# chạy trong container gọi spark-submit.
spark.submit.deployMode              client

# Executor cần kết nối ngược về driver: cố định cổng driver và block manager.
# spark.driver.host được entrypoint điền bằng IP container lúc chạy (xem
# docker-compose.yml), vì `docker compose run` sinh tên container ngẫu nhiên.
spark.driver.bindAddress             0.0.0.0
spark.driver.port                    7078
spark.blockManager.port              7079

# --- Tài nguyên: mỗi worker nhường đúng một executor 1 core / 1 GB ----------
spark.executor.cores                 1
spark.executor.memory                1g
# Số core tối đa một ứng dụng được cấp: 2 = một executor trên mỗi worker.
# Job streaming ghi đè thành 1 để chừa một worker cho job batch.
spark.cores.max                      2
spark.driver.memory                  768m

# Mặc định 200 partition sau shuffle là quá nhiều cho 2 executor và dữ liệu
# cỡ vài trăm MB; AQE gộp tiếp các partition nhỏ lúc chạy.
spark.sql.shuffle.partitions         8
spark.sql.adaptive.enabled           true
spark.sql.session.timeZone           UTC

# --- Iceberg: dùng chung REST catalog với Trino -----------------------------
# Tên catalog `lakehouse` trùng với trino/catalog/lakehouse.properties, nên
# `lakehouse.bronze.orders` là cùng một bảng ở cả hai engine.
spark.sql.extensions                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse          org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type     rest
spark.sql.catalog.lakehouse.uri      http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse s3://lakehouse/
spark.sql.catalog.lakehouse.io-impl  org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.client.region us-east-1
spark.sql.defaultCatalog             lakehouse

# --- S3A: file thường (CSV ở s3a://raw/, checkpoint streaming) ---------------
# Thông tin xác thực lấy từ biến môi trường AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY của container, không ghi trong file này.
spark.hadoop.fs.s3a.endpoint         http://minio:9000
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl             org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# --- Timeout: báo lỗi nhanh thay vì treo ------------------------------------
# Mặc định của Hadoop 3.3.4 (connection.timeout=200000 ms, attempts=20) cho
# phép một kết nối hỏng treo rất lâu trước khi báo lỗi. Với job streaming
# chạy liên tục, lỗi nhanh để Spark retry hoặc container khởi động lại là
# hành vi mong muốn.
spark.hadoop.fs.s3a.connection.timeout              30000
spark.hadoop.fs.s3a.connection.establish.timeout    5000
spark.hadoop.fs.s3a.attempts.maximum                5
spark.hadoop.fs.s3a.retry.limit                     5
# Tương tự cho HTTP client của Iceberg (REST catalog và S3FileIO)
spark.sql.catalog.lakehouse.http-client.apache.socket-timeout-ms      30000
spark.sql.catalog.lakehouse.http-client.apache.connection-timeout-ms  5000
